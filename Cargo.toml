[package]
name = "frisket"
version = "0.3.5"
edition = "2024"
authors = ["Jan Philipp Thiele"]
description = "A CLI tool for managing LaTeX projects"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.5", features = ["derive"]}
clap_complete = "4.5.66"
dialoguer = "0.12.0"
directories = "6.0.0"
flate2 = "1.1.9"
git2 = { version = "0.20.4", features = ["vendored-libgit2"]}
indoc = "2.0.7"
reqwest = {version = "0.13.2", features = ["blocking"]}
serde = { version = "1.0.228", features = ["alloc", "derive", "rc"] }
tar = "0.4.45"
tempfile = "3.27.0"
toml = "0.9.10"
xz = "0.1.0"
